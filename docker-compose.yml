services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: requerimientos-ifsa-backend
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: requerimientos-ifsa-frontend
    ports:
      - "8004:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
