server {
    listen 80;
    server_name _;

    # Uploaded ticket descriptions can be long; keep some headroom.
    client_max_body_size 10m;

    # SPA: any unknown path is handed to index.html so vue-router resolves it.
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # The browser talks only to this origin. Everything under /api is forwarded
    # to the backend container over the compose network, so the backend needs no
    # published port and no CORS handling.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Cloudflare and Nginx Proxy Manager terminate TLS upstream; pass the
        # original scheme through so the app can build correct absolute URLs.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend:5000/health;
        access_log off;
    }
}
